    1. Copy this file to: {subject}/{class}th/chapters/ch{N}.html

    3. Fill in the sections with your content
    4. Save the file
    5. Run: .\build-manifest.ps1

    - <div class="pfa-formula" data-name="NAME" data-formula="FORMULA"></div>

    - <div class="pfa-numerical"> ... question ... answer ... </div>
    - <div class="pfa-warning"> ... common mistake text ... </div>
    - <div class="pfa-revision"> ... revision point ... </div>
    - <div class="pfa-summary"> ... summary content ... </div>

    - <div class="pfa-assertion" data-correct="a|b|c|d"> ... A/R ... </div>
    - <div class="pfa-notes"> ... notes content ... </div>
